app = "apitrench-fixture-api"
primary_region = "iad"

[env]
  PORT = "8080"
  FIXTURE_BASE_URL = "https://apitrench-fixture-api.fly.dev"
  ALLOWED_REDIRECT_ORIGINS = "*"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
